<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>

<body>

    <h1>Job Application Form</h1>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="contact">Contact:</label>
            <input type="tel" id="contact" name="contact" required>
            <br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
            <br><br>

            <label for="province">Province:</label>
            <select id="province" name="province">
                <option value="">-- Select Province --</option>
                <option value="Koshi">Koshi Province</option>
                <option value="Madhesh">Madhesh Province</option>
                <option value="Bagmati">Bagmati Province</option>
                <option value="Gandaki">Gandaki Province</option>
                <option value="Lumbini">Lumbini Province</option>
                <option value="Karnali">Karnali Province</option>
                <option value="Sudurpashchim">Sudurpashchim Province</option>
            </select>
       

        <br>

        <!-- Higher Education -->
       
            <legend>Higher Education</legend>

            <label for="education">Education Level:</label>
            <select id="education" name="education">
                <option value="">-- Select Education Level --</option>
                <option value="highschool">High School</option>
                <option value="master">Master Level</option>
                <option value="phd">PhD Level</option>
            </select>
        

        <br>

        <!-- Work Experience -->
       
            <legend>Work Experience</legend>

            <label for="company">Previous Company Name:</label>
            <input type="text" id="company" name="company">
            <br><br>

            <label for="experience">Experience Level:</label>
            <select id="experience" name="experience">
                <option value="">-- Select Experience --</option>
                <option value="1year">1 Year</option>
                <option value="2years">2 Years</option>
                <option value="3years">3 Years</option>
       

        <br>

        <!-- Other Details -->
        <fieldset>
            <legend>Other Details</legend>

            <label for="coverletter">Cover Letter:</label>
            <br>
            <textarea id="coverletter" name="coverletter"
                      rows="8" cols="50"
                      placeholder="Write your cover letter here..."></textarea>
            <br><br>

            <label for="cv">Upload CV:</label>
            <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx">
       

        <br>

        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
